name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      WINTUN_VERSION: "0.14.1"
      WINTUN_SHA256: "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      # --- runtime binaries for src-tauri/bin (bundled as resources) ---

      - name: Xray + GeoIP/GeoSite (pinned, SHA-256 verified)
        run: ./scripts/install-xray.ps1

      - name: Wintun (TUN mode)
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "wintun.zip"
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:WINTUN_SHA256) { throw "wintun SHA-256 mismatch: $hash" }
          $out = Join-Path $env:RUNNER_TEMP "wintun"
          Expand-Archive $zip -DestinationPath $out
          Copy-Item (Join-Path $out "wintun/bin/amd64/wintun.dll") src-tauri/bin/wintun.dll -Force

      - name: AmneziaWG (amneziawg.exe + awg.exe from the bundled MSI)
        run: |
          $msi = (Resolve-Path src-tauri/bin/amneziawg.msi).Path
          $out = Join-Path $env:RUNNER_TEMP "amneziawg"
          $p = Start-Process msiexec.exe -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$out`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a failed: $($p.ExitCode)" }
          foreach ($name in @("amneziawg.exe", "awg.exe")) {
            $file = Get-ChildItem $out -Recurse -Filter $name | Select-Object -First 1
            if (-not $file) { throw "$name not found in amneziawg.msi" }
            Copy-Item $file.FullName "src-tauri/bin/$name" -Force
          }
          Get-ChildItem src-tauri/bin | ForEach-Object {
            "{0,-14} {1,12} {2}" -f $_.Name, $_.Length, (Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }

      # --- checks ---

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked --lib

      # --- build ---

      - name: Build installer (NSIS)
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: VeilBox-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
