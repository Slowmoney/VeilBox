name: Build

# Push to master / PR: build and test, installers as run artifacts.
# Tag v*: the app version comes from the tag, installers are signed for the
# in-app updater and published to GitHub Releases together with latest.json
# (the updater endpoint in tauri.conf.json).
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Signing key for updater artifacts (repo secrets). Without it the build
  # still works, just without updater files.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${env:GITHUB_REF_NAME}"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Runtime binaries (Xray, geo rules, Wintun, AmneziaWG)
        run: ./scripts/setup-bin.ps1

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked --lib

      - name: Build installer (NSIS)
        run: |
          $extra = @()
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { $extra = @('--config', 'src-tauri/tauri.updater.conf.json') }
          npm run tauri build -- --bundles nsis @extra

      - uses: actions/upload-artifact@v4
        with:
          name: VeilBox-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            updater: darwin-aarch64
            goarch: arm64
            xray_asset: Xray-macos-arm64-v8a.zip
          - arch: x64
            target: x86_64-apple-darwin
            updater: darwin-x86_64
            goarch: amd64
            xray_asset: Xray-macos-64.zip
    env:
      XRAY_VERSION: "v26.9.9"
      AMNEZIAWG_GO_REF: "v3.1.20260828"
      AMNEZIAWG_TOOLS_REF: "v3.1.20260812"
      GEO_REPO: "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      # --- runtime binaries for src-tauri/bin (see tauri.macos.conf.json) ---

      - name: Xray (SHA-256 from the release .dgst)
        run: |
          set -euo pipefail
          base="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${{ matrix.xray_asset }}"
          curl -fsSL -o "$RUNNER_TEMP/xray.zip" "$base"
          curl -fsSL -o "$RUNNER_TEMP/xray.dgst" "$base.dgst"
          want=$(grep -E '^SHA2-256=' "$RUNNER_TEMP/xray.dgst" | awk '{print $2}')
          have=$(shasum -a 256 "$RUNNER_TEMP/xray.zip" | awk '{print $1}')
          [ -n "$want" ] && [ "$want" = "$have" ] || { echo "xray SHA-256 mismatch: $have != $want"; exit 1; }
          unzip -o "$RUNNER_TEMP/xray.zip" xray -d src-tauri/bin
          chmod +x src-tauri/bin/xray

      - name: Geo rules (runetfreedom, SHA-256 verified)
        run: |
          set -euo pipefail
          for name in geoip.dat geosite.dat; do
            curl -fsSL -o "$RUNNER_TEMP/$name" "$GEO_REPO/$name"
            curl -fsSL -o "$RUNNER_TEMP/$name.sha256sum" "$GEO_REPO/$name.sha256sum"
            want=$(awk '{print $1}' "$RUNNER_TEMP/$name.sha256sum")
            have=$(shasum -a 256 "$RUNNER_TEMP/$name" | awk '{print $1}')
            [ "$want" = "$have" ] || { echo "$name SHA-256 mismatch"; exit 1; }
            cp "$RUNNER_TEMP/$name" "src-tauri/bin/$name"
          done

      - name: amneziawg-go
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$AMNEZIAWG_GO_REF" https://github.com/amnezia-vpn/amneziawg-go "$RUNNER_TEMP/amneziawg-go"
          cd "$RUNNER_TEMP/amneziawg-go"
          GOOS=darwin GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/src-tauri/bin/amneziawg-go"

      - name: awg (amneziawg-tools)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$AMNEZIAWG_TOOLS_REF" https://github.com/amnezia-vpn/amneziawg-tools "$RUNNER_TEMP/amneziawg-tools"
          arch=${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
          make -C "$RUNNER_TEMP/amneziawg-tools/src" CC="clang -arch $arch" PLATFORM=darwin wg
          cp "$RUNNER_TEMP/amneziawg-tools/src/wg" src-tauri/bin/awg
          chmod +x src-tauri/bin/awg
          file src-tauri/bin/xray src-tauri/bin/amneziawg-go src-tauri/bin/awg

      # --- checks ---

      - name: Rust tests
        if: matrix.arch == 'arm64'
        working-directory: src-tauri
        run: cargo test --locked --lib

      # --- build ---

      - name: Build app + DMG
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then extra=(--config src-tauri/tauri.updater.conf.json); fi
          npm run tauri build -- --target ${{ matrix.target }} --bundles app,dmg ${extra[@]+"${extra[@]}"}

      # The updater archive has the same name on both architectures: make it unique.
      - name: Collect bundles
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          cp "$bundle"/dmg/*.dmg "$out/"
          for f in "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            cp "$f" "$out/${name/.app.tar.gz/_${{ matrix.updater }}.app.tar.gz}"
          done
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: VeilBox-macos-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: latest.json for the in-app updater
        run: node scripts/updater-manifest.mjs dist "$GITHUB_REF_NAME" "${{ github.repository }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
